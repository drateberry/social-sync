name = "social-sync-web"
main = ".open-next/worker.js"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

# Direct Worker-to-Worker call (bypasses public routing, no loop risk).
# Target worker must be deployed on the same Cloudflare account.
[[services]]
binding = "API"
service = "social-sync"
